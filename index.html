<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Breakout — Gauntlet Loop Experiment</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <h1>Breakout</h1>
      <p>Gauntlet Loop Experiment</p>
    </header>

    <section class="hud" aria-label="Status do jogo" aria-live="polite" aria-atomic="true">
      <span>Pontos: <strong id="score">0</strong></span>
      <span>Vidas: <strong id="lives">3</strong></span>
    </section>

    <canvas id="game" width="800" height="520" aria-label="Jogo Breakout"></canvas>

    <div class="controls">
      <button id="startButton" type="button">Iniciar</button>
      <p id="gameStatus" role="status" aria-live="polite"></p>
      <p>Use ← →, A/D ou arraste sobre o jogo para mover a raquete.</p>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
