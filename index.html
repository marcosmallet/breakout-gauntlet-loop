<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Breakout — Gauntlet Loop Experiment</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <h1>Breakout</h1>
      <p>Gauntlet Loop Experiment</p>
    </header>

    <section class="hud" aria-label="Status do jogo" aria-live="polite" aria-atomic="true">
      <span>Pontos: <strong id="score">0</strong></span>
      <span>Recorde: <strong id="highScore">0</strong></span>
      <span>Combo: <strong id="combo">x0</strong></span>
      <span>Vidas: <strong id="lives">3</strong></span>
      <span>Rodada: <strong id="round">1</strong></span>
      <span>Modo: <strong id="roundMode" data-elite="false">Normal</strong></span>
      <span>Blocos: <strong id="bricksRemaining" data-final-stretch="false">50</strong></span>
    </section>

    <canvas id="game" width="800" height="520" aria-label="Jogo Breakout" aria-description="Durante a contagem antes do lançamento, mova a raquete para mirar a direção da bola." aria-describedby="controlInstructions" aria-keyshortcuts="ArrowLeft ArrowRight A D Space"></canvas>

    <div class="controls">
      <button id="startButton" type="button">Iniciar</button>
      <button id="pauseButton" type="button" aria-pressed="false" aria-keyshortcuts="Space" disabled>Pausar</button>
      <p id="gameStatus" role="status" aria-live="polite"></p>
      <p id="controlInstructions">Use ← →, A/D ou arraste sobre o jogo para mover a raquete. Pressione Espaço ou use o botão Pausar para pausar ou retomar.</p>
    </div>
  </main>

  <script>
    window.addEventListener('pointerdown', (event) => {
      if (event.target === document.getElementById('game')) {
        window.dispatchEvent(new Event('focus'));
      }
    }, true);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        window.dispatchEvent(new Event('blur'));
      } else if (document.hasFocus()) {
        window.dispatchEvent(new Event('focus'));
      }
    });

    const roundEl = document.getElementById('round');
    const gameCanvas = document.getElementById('game');
    const gameStatusEl = document.getElementById('gameStatus');
    const scoreEl = document.getElementById('score');
    const bricksRemainingEl = document.getElementById('bricksRemaining');
    const FINAL_STRETCH_THRESHOLD = 5;
    let previousBricksRemaining = 50;
    const syncRoundHud = () => {
      const currentRound = window.__GAME_DEBUG__?.getState().round;
      if (currentRound) {
        roundEl.textContent = currentRound;
        const accentHue = (205 + (currentRound - 1) * 38) % 360;
        gameCanvas.style.setProperty('--round-accent-hue', accentHue);
        document.documentElement.style.setProperty('--round-accent-hue', accentHue);
      }
    };
    const pulseFinalStretch = () => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      bricksRemainingEl.animate(
        [
          { transform: 'scale(1)', textShadow: 'none' },
          { transform: 'scale(1.25)', textShadow: '0 0 12px currentColor' },
          { transform: 'scale(1)', textShadow: 'none' }
        ],
        { duration: 300, easing: 'ease-out' }
      );
      gameCanvas.animate(
        [
          { filter: 'brightness(1)' },
          { filter: 'brightness(1.12)' },
          { filter: 'brightness(1)' }
        ],
        { duration: 300, easing: 'ease-out' }
      );
    };
    const syncBrickProgress = () => {
      const remaining = window.__GAME_DEBUG__?.getState().bricksRemaining;
      if (Number.isInteger(remaining)) {
        bricksRemainingEl.textContent = remaining;
        const isFinalStretch = remaining > 0 && remaining <= FINAL_STRETCH_THRESHOLD;
        bricksRemainingEl.dataset.finalStretch = String(isFinalStretch);
        if (isFinalStretch && remaining < previousBricksRemaining) pulseFinalStretch();
        previousBricksRemaining = remaining;
      }
    };
    new MutationObserver(syncRoundHud).observe(gameStatusEl, {
      childList: true,
      characterData: true,
      subtree: true
    });
    new MutationObserver(syncBrickProgress).observe(scoreEl, {
      childList: true,
      characterData: true,
      subtree: true
    });
  </script>
  <script src="difficulty.js"></script>
  <script src="game.js"></script>
  <script src="high-score.js"></script>
  <script src="combo.js"></script>
  <script src="elite-round.js"></script>
  <script src="impact-shake.js"></script>
  <script src="impact-sound.js"></script>
  <script src="life-loss-feedback.js"></script>
  <script src="life-gain-feedback.js"></script>
  <script src="ball-trail.js"></script>
  <script src="last-life-feedback.js"></script>
  <script src="last-life-clutch.js"></script>
  <script src="edge-shot-boost.js"></script>
  <script src="launch-countdown.js"></script>
  <script src="round-clear-feedback.js"></script>
  <script src="game-over-feedback.js"></script>
</body>
</html>
