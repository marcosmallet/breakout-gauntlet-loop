name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright with diagnostic report
        run: npx playwright test --reporter=json > playwright-results.json
      - name: Upload Playwright diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostic
          path: playwright-results.json
